# 🚀 GitHub Actions Continuous Integration (CI) Workflow Config
name: TaskFlow API CI

# 🚀 Triggers: Executed on every git push or pull request targeting the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # ⚙️ Runs on the latest Ubuntu runner hosted environment
    runs-on: ubuntu-latest

    steps:
      # 🚀 Step 1: Checkout codebase to access code files inside the workflow runner
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 🚀 Step 2: Set up Python 3.11 environment inside the runner machine
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🚀 Step 3: Cache pip dependencies to speed up subsequent workflow executions
      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 🚀 Step 4: Upgrade pip tool and install all production + dev dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # 🚀 Step 5: Linting and Formatting Check
      - name: Code Formatting (Black)
        run: black --check app tests/

      - name: Linting (Flake8)
        run: flake8 app tests/

      # 🚀 Step 6: Static Type Checking
      - name: Type Checking (Mypy)
        run: mypy app

      # 🚀 Step 7: Security Scanning
      - name: Security Scan (Bandit)
        run: bandit -r app/

      # 🚀 Step 8: Execute test suite and display code coverage report
      - name: Run Pytest Test Suite & Coverage
        run: |
          pytest --cov=app tests/
